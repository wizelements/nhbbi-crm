name: NHBBI framework compatibility
on:
  push:
    branches: [security/next15-lts-20261012]
  pull_request:
    paths: ['package.json','package-lock.json','next.config.js','lib/admin/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run lib/admin
      - name: Confirm security baseline
        run: node -e "const p=require('./package.json'); if(p.dependencies.next!=='15.5.27'||p.dependencies.react!=='19.2.6') process.exit(1)"
