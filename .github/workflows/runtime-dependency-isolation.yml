name: NHBBI runtime dependency isolation
on:
  push:
    branches: [security/build-only-tailwind-20261012]
    paths: ['.github/workflows/runtime-dependency-isolation.yml']
permissions:
  contents: write
jobs:
  classify-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --include=dev
      - name: Move Tailwind animation plugin to build-only dependency
        run: npm install --save-dev --save-exact tailwindcss-animate@1.0.7
      - name: Validate locked dependency installation
        run: npm ci --include=dev
      - name: Verify TypeScript and authorization
        run: |
          npm run typecheck
          npx vitest run lib/admin
      - name: Block high-severity runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Record build-only findings separately
        run: |
          npm audit --audit-level=high || echo 'Build-tool advisories remain; review their exposure in CI.'
      - name: Commit only dependency manifest and lockfile
        run: |
          git config user.name 'nhbbi-ci'
          git config user.email 'nhbbi-ci@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'security(deps): classify Tailwind animation plugin as build-only'
          git push origin HEAD:security/build-only-tailwind-20261012
