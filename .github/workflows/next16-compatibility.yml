name: NHBBI Next.js 16 upgrade candidate
on:
  push:
    branches: [security/next16-review-20261012]
    paths: ['.github/workflows/next16-compatibility.yml']
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install patched major Next.js and matching ESLint config
        run: npm install --save-exact next@16.4.0 eslint-config-next@16.4.0
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run lib/admin
      - name: Save passing dependency lockfile on review branch
        run: |
          git config user.name 'nhbbi-ci'
          git config user.email 'nhbbi-ci@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'security(deps): evaluate Next.js 16.4.0'
          git push origin HEAD:security/next16-review-20261012
