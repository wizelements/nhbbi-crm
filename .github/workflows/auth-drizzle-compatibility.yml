name: NHBBI auth-ORM patch compatibility
on:
  push:
    branches: [security/auth-drizzle-remediation-20261012]
    paths: ['.github/workflows/auth-drizzle-compatibility.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install patched Auth.js and Drizzle temporarily
        run: npm install --save-exact @auth/core@0.41.3 drizzle-orm@0.45.4
      - name: Validate application type safety
        run: npm run typecheck
      - name: Validate access-control tests
        run: npx vitest run lib/admin
